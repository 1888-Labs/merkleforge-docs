name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check pinned crate versions match versions.json
        run: |
          python3 scripts/sync_versions.py "$(python3 -c "import json; print(json.load(open('versions.json'))['rust'])")"
          git diff --exit-code

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run build
